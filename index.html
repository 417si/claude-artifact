<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LD-1">
<meta name="theme-color" content="#0a0a0a">
<meta name="format-detection" content="telephone=no">
<title>LD-1 · Loop Device</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preload" href="fonts/doto.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="r0">
      <span class="brand">LD<b>—</b>1</span>
      <span id="hSr">--.-K</span><span id="hLat">LAT --</span><span id="hVox">VOX 00</span><span id="hJit">JIT -.-</span>
      <span class="sp"></span>
      <span id="hRec" class="rec-ind">● REC</span>
      <span id="hClock">--:--</span>
    </div>
    <div class="r1">
      <div class="cell" id="bpmBox"><div class="lbl">BPM <i>↕</i></div><div class="big" id="hBpm">120</div></div>
      <div class="cell"><div class="lbl">BAR.BT.ST</div><div class="big" id="hPos">01.1.1</div></div>
      <div class="cell w"><div class="lbl" id="hKey">A MIN</div><div class="mid" id="hChord">Am</div><div class="sub" id="hChordN">— — —</div></div>
      <div class="cell w"><div class="lbl" id="hHz">LEAD</div><div class="mid" id="hNote">—</div><div class="tuner"><i id="hTun"></i></div></div>
    </div>
    <div class="r2">
      <canvas id="scope"></canvas>
      <div class="pk"><div class="lbl">PEAK</div><div id="hPk">-∞</div><div class="vm"><i id="hPkBar"></i></div></div>
    </div>
    <div class="r3">
      <div id="leds" class="leds"></div>
      <div id="bars" class="bars"></div>
      <span id="hScene">SCN A</span>
    </div>
  </header>
  <nav id="tabs"></nav>
  <main id="panel"></main>
  <footer id="trans">
    <button id="bPlay" class="tb play"><svg viewBox="0 0 20 20"><path class="ic-play" d="M6 4l10 6-10 6z"/><rect class="ic-stop" x="5" y="5" width="10" height="10"/></svg></button>
    <button id="bRec" class="tb rec"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="5.5"/></svg></button>
    <button id="bMet" class="tb met"><span>CLK</span></button>
    <div class="scenes" id="scenes"></div>
  </footer>
</div>
<div id="boot">
  <div class="bt-grid"></div>
  <div class="bt-in">
    <div class="bt-logo">LD-1</div>
    <div class="bt-sub">LOOP DEVICE · POCKET DAW</div>
    <div class="bt-spec">
      <span>4 SCENES</span><span>6 DRUM VOICES</span><span>MONO BASS</span><span>POLY CHORD</span><span>STRING LEAD</span><span>MOTION REC</span>
    </div>
    <div class="bt-tap"><i></i>TAP TO POWER ON</div>
    <div class="bt-note">ホーム画面に追加するとフルスクリーンで動きます · 音が出ない時は消音スイッチを確認</div>
  </div>
</div>
<div id="toast"></div>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/drums.js"></script>
<script src="js/seq.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
